<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar - Gestão de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gestão de Alunos</h1>
    <div id="mensagem" style="text-align: center; font-weight: bold; height: 20px;"></div>
    <section>
        <h2>Cadastrar/Editar Aluno</h2>
        <form id="form-aluno">
            <input type="text" id="nome" placeholder="Nome do Aluno" required>
            <input type="text" id="turma" placeholder="Turma (ex: 3DAM1)" required>
            <input type="number" id="idade" placeholder="Idade" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div id="mensagem-aluno"></div> 
    </section>

    <hr>

    <section>
        <h2>Lista de Alunos</h2>
        <button onclick="listarAlunos()">Atualizar Lista</button>
        <table border="1" id="tabela-alunos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </section>
    <section>
        <h2>Lançar/Editar Nota</h2>
        <form id="form-nota">
            <input type="number" id="nota-alunoId" placeholder="ID do Aluno" required>
            <input type="text" id="disciplina" placeholder="Disciplina" required>
            <input type="number" step="0.1" id="valor-nota" placeholder="Nota (0-10)" required>
            <button type="submit">Salvar Nota</button>
            <button type="button" onclick="resetarFormNota()">Cancelar</button>
        </form>
        <div id="mensagem-nota"></div>
    </section>

    <section>
        <h2>Lista de Notas</h2>
        <table border="1" id="tabela-notas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Aluno ID</th>
                    <th>Disciplina</th>
                    <th>Nota</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
